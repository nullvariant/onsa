# Pre-commit configuration template for JS/TS repositories.
# Authority: source code quality tooling standard.
#
# Usage:
# 1. Copy this file to .pre-commit-config.yaml in the consumer repository.
# 2. Copy configs/gitleaks/.gitleaks.toml to the consumer repository root.

# Shared hooks (pre-commit-hooks, gitleaks) are duplicated in both
# .pre-commit-config-js-ts.yaml and .pre-commit-config-python.yaml.
# Update both files on version bumps.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: local
    hooks:
      - id: vitest-changed
        name: vitest (changed files)
        entry: sh -c 'git rev-parse HEAD~1 >/dev/null 2>&1 && npx vitest --changed HEAD~1 --run || npx vitest --run'
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
